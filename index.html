<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curious</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-lockup">
          <div class="brand-arch" aria-hidden="true">
            <svg viewBox="0 0 120 180" role="presentation">
              <path d="M24 156V70C24 33.549 40.118 12 60 12C79.882 12 96 33.549 96 70V156" />
            </svg>
          </div>
          <h1 class="brand-title">Curious</h1>
          <p class="tagline">A path inward</p>
          <span class="brand-divider" aria-hidden="true"></span>
        </div>
      </header>

      <nav class="tab-bar" aria-label="Primary">
        <button class="tab-button is-active" data-tab="checkin" type="button">
          Check In
        </button>
        <button class="tab-button" data-tab="threads" type="button">
          Patterns
        </button>
      </nav>

      <main>
        <section class="tab-panel is-active" data-panel="checkin">
          <div class="card" id="checkin-card"></div>
        </section>

        <section class="tab-panel" data-panel="threads">
          <div class="card">
            <div class="threads-copy">
              <p class="eyebrow">Patterns</p>
              <h2>Session Log</h2>
              <p class="muted">A quiet record of what I’ve noticed.</p>
            </div>
            <div id="threads-content" class="threads-grid"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
